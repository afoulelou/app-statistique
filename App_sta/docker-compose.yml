services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app_statistique
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_statistique"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
    environment:
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_VERSION: 0.1.0
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_statistique
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: ./services/api
    environment:
      APP_ENV: development
      API_VERSION: 0.1.0
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_statistique
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
