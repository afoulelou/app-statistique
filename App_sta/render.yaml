services:
  - type: web
    name: app-statistique-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./App_sta/services/api/Dockerfile
    dockerContext: ./App_sta/services/api
    autoDeployTrigger: commit
    healthCheckPath: /health
    dockerCommand: >-
      /bin/sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    envVars:
      - key: APP_ENV
        value: production
      - key: API_VERSION
        value: 0.1.0
      - key: DATABASE_URL
        fromDatabase:
          name: app-statistique-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATASET_STORAGE_PATH
        value: /tmp/app-statistique/uploads

databases:
  - name: app-statistique-db
    databaseName: app_statistique
    user: app_statistique
    plan: free
    region: frankfurt