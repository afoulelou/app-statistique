[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "app-statistique-api"
version = "0.1.0"
description = "API de l'application pedagogique d'analyse statistique"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "PyJWT>=2.9,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "pydantic[email]>=2.7,<3.0",
  "pandas>=2.2,<3.0",
  "python-multipart>=0.0.18,<1.0",
  "scipy>=1.13,<2.0",
  "statsmodels>=0.14,<1.0",
  "scikit-learn>=1.5,<2.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "mypy==1.13.0",
  "pytest>=8.3,<9.0",
  "ruff==0.8.6",
  "aiosqlite>=0.20,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true
